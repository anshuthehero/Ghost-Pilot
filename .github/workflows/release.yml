name: Build & Release Ghost Copilot

on:
  push:
    tags:
      - "v*"          # triggers on v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # allows manual trigger from GitHub UI
    inputs:
      version:
        description: "Version label (e.g. v1.2.0) — used for artifact naming"
        required: false
        default: "dev"

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  # ── Windows build → GhostCopilot_Setup.exe ──────────────────────────────────
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine PyInstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: cmd
        run: |
          pyinstaller packaging/windows/launcher_win.spec --noconfirm --clean

      - name: Verify build output exists
        shell: cmd
        run: |
          if not exist dist\GhostCopilot\GhostCopilot.exe (
            echo [ERROR] Build failed — GhostCopilot.exe not found in dist\GhostCopilot\
            exit /b 1
          )
          echo [OK] Build verified.

      - name: Package as ZIP
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -ne "") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.version }}" }
          Compress-Archive -Path dist\GhostCopilot\* -DestinationPath "GhostCopilot_Windows_$ver.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: "GhostCopilot_Windows_*.zip"

  # ── macOS build → GhostCopilot_Mac.zip ──────────────────────────────────────
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine PyInstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller packaging/macos/launcher_mac.spec --noconfirm --clean

      - name: Verify build output exists
        run: |
          if [ ! -d "dist/Ghost Copilot.app" ]; then
            echo "[ERROR] Build failed — Ghost Copilot.app not found in dist/"
            exit 1
          fi
          echo "[OK] Build verified."

      - name: Package as ZIP
        run: |
          VER="${{ github.ref_name }}"
          if [ -z "$VER" ]; then VER="${{ github.event.inputs.version }}"; fi
          cd dist
          zip -r "../GhostCopilot_Mac_${VER}.zip" "Ghost Copilot.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: "GhostCopilot_Mac_*.zip"

  # ── GitHub Release — attaches both zips ─────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Create Release
        # BUG-04 fix: pin to specific version tag (not @v2 floating)
        uses: softprops/action-gh-release@v2.0.4
        with:
          name: "Ghost Copilot ${{ github.ref_name }}"
          body: |
            ## Ghost Copilot ${{ github.ref_name }}

            ### Download for your platform

            | Platform | File | Instructions |
            |---|---|---|
            | **Windows** | `GhostCopilot_Windows_*.zip` | Unzip → double-click `GhostCopilot.exe` |
            | **macOS** | `GhostCopilot_Mac_*.zip` | Unzip → drag `Ghost Copilot.app` to Applications |

            ### First-time setup
            The launcher wizard opens automatically on first launch.
            Have your [Groq API key](https://console.groq.com) ready — paste it in when asked.

            ### Requirements
            - Windows 10 or later
            - macOS 11 (Big Sur) or later
            - No Python install needed — everything is bundled

            ---
            > Zero personal data collected. All processing happens locally on your device.
          draft: false
          prerelease: false
          files: |
            GhostCopilot_Windows_*.zip
            GhostCopilot_Mac_*.zip
